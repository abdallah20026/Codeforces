name: Sync Codeforces Submissions

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync Codeforces Submissions
        uses: garimasingh128/codeforces-action@v1.0.1
        with:
          max-submissions: 10
          codeforces-handle: 'Abdullahs99' #
          github-token: ${{ secrets.GH_TOKEN }}
