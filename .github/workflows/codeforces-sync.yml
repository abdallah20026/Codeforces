name: Sync Codeforces Submissions

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Sync Codeforces Submissions
        uses: beiciy/codeforces-action@v1.1
        with:
          max-submissions: 10
          codeforces-handle: 'Abdullahs99' # 
          github-token: ${{ secrets.GH_TOKEN }}
